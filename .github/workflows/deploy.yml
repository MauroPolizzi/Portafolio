name: Build & Deploy

on:
  # Cada push a master valida y publica.
  push:
    branches: [master]
  # En un pull request solo se valida: no se publica nada.
  pull_request:
    branches: [master]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Por defecto, el token solo puede leer el repositorio.
permissions:
  contents: read

# No se cancela un deploy a medio camino: los pushes seguidos hacen cola.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validar y compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci instala exactamente lo que dice package-lock.json.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build genera el sitio estático en out/ (output: 'export').
      - name: Build de producción
        run: npm run build

      - name: Subir el sitio como artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Publicar en GitHub Pages
    # Solo se publica desde master. Si el job anterior falla, este no corre
    # y el sitio se queda con la última versión que sí funcionaba.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
